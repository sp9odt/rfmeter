<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b0d10">
<title>RF Meter - ekran</title>
<style>
  :root {
    --bg: #0b0d10;
    --panel: #161a20;
    --line: #2a313b;
    --text: #e8ecf1;
    --muted: #8b95a3;
    --accent: #2192ff;
    --ok: #22c55e;
    --warn: #f59e0b;
    --err: #ef4444;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--text);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  body { padding: 12px 16px 24px; max-width: 520px; margin: 0 auto; }
  header { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 10px; }
  h1 { font-size: 17px; margin: 0; font-weight: 600; letter-spacing: .2px; }
  .status { font-size: 13px; color: var(--muted); display: flex; align-items: center; gap: 6px; }
  .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--err); }
  .dot.on { background: var(--ok); }
  .dot.wait { background: var(--warn); }
  .tft-wrap { background: #000; border: 1px solid var(--line); border-radius: 10px; padding: 8px; }
  canvas { display: block; width: 100%; height: auto; aspect-ratio: 1 / 1; image-rendering: pixelated; }
  .info { font-size: 12px; color: var(--muted); min-height: 16px; margin: 6px 2px 10px; }
  .info.menu { color: var(--warn); }
  .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
  button { font: inherit; font-size: 15px; color: var(--text); background: var(--panel);
    border: 1px solid var(--line); border-radius: 10px; padding: 13px 6px; touch-action: manipulation; }
  button:active { background: #222833; }
  button:disabled { opacity: .4; }
  button.primary { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 600; }
  button.rec { color: var(--err); }
  .connect { width: 100%; margin-bottom: 10px; }
  .row { display: flex; gap: 8px; margin-top: 8px; }
  .row input { flex: 1; min-width: 0; font: inherit; font-size: 15px; background: var(--panel); color: var(--text);
    border: 1px solid var(--line); border-radius: 10px; padding: 11px 10px; }
  details { margin-top: 12px; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 8px 10px; }
  summary { cursor: pointer; font-size: 14px; color: var(--muted); }
  pre { margin: 8px 0 0; max-height: 200px; overflow: auto; font-size: 12px; white-space: pre-wrap; word-break: break-word; }
  .hint { font-size: 12px; color: var(--muted); margin-top: 12px; line-height: 1.45; }
  .err { color: var(--err); }
</style>
</head>
<body>
<header>
  <h1>RF Meter 1.1 BT</h1>
  <div class="status"><span id="dot" class="dot"></span><span id="stat">rozłączony</span></div>
</header>

<button id="btnConnect" class="primary connect">Połącz z miernikiem</button>

<div class="tft-wrap"><canvas id="tft" width="512" height="512"></canvas></div>
<div id="info" class="info"></div>

<div class="grid">
  <button data-act="bandDn" disabled>Pasmo −</button>
  <button data-act="bandUp" disabled>Pasmo +</button>
  <button data-act="unit" disabled>Jednostka</button>
  <button data-act="hold" disabled>HOLD</button>
  <button data-act="mmrst" disabled>Reset MAX/MIN</button>
  <button data-act="save" disabled>Zapisz</button>
</div>
<div class="row">
  <button id="btnRec" class="rec" disabled style="flex:1">● Zapis CSV</button>
</div>
<div class="row">
  <input id="cmd" placeholder="Komenda, np. ATT 20" autocomplete="off" autocapitalize="characters">
  <button id="btnSend" disabled>Wyślij</button>
</div>

<details>
  <summary>Komunikaty z miernika</summary>
  <pre id="log"></pre>
</details>

<p class="hint" id="hint">Strona wymaga przeglądarki <b>Chrome</b> na Androidzie i adresu <b>https://</b>.
Na mierniku włącz MENU → Bluetooth → WL. Nie paruj miernika w ustawieniach telefonu.</p>

<script>
"use strict";
// ---------------------------------------------------------------------
//  Bluetooth LE - Nordic UART Service
// ---------------------------------------------------------------------
const NUS = "6e400001-b5a3-f393-e0a9-e50e24dcca9e";
const RX  = "6e400002-b5a3-f393-e0a9-e50e24dcca9e";   // telefon -> miernik
const TX  = "6e400003-b5a3-f393-e0a9-e50e24dcca9e";   // miernik -> telefon

let device = null, rxChar = null, txChar = null;
let connected = false, userDisconnect = false, reconnectTries = 0;
let lineBuf = "", writeChain = Promise.resolve(), wakeLock = null;
let data = null, lastFrameAt = 0;
const enc = new TextEncoder(), dec = new TextDecoder();

const $ = (id) => document.getElementById(id);

function setStatus(text, state) {
  $("stat").textContent = text;
  $("dot").className = "dot" + (state === "on" ? " on" : state === "wait" ? " wait" : "");
}

function log(line) {
  const el = $("log");
  el.textContent = (el.textContent + line + "\n").split("\n").slice(-120).join("\n");
  el.scrollTop = el.scrollHeight;
}

function enableUi(on) {
  document.querySelectorAll("[data-act]").forEach(b => b.disabled = !on);
  $("btnSend").disabled = !on;
  $("btnRec").disabled = !on;
  $("btnConnect").textContent = on ? "Rozłącz" : "Połącz z miernikiem";
  $("btnConnect").classList.toggle("primary", !on);
}

function send(cmd) {
  if (!rxChar) return;
  const bytes = enc.encode(cmd + "\n");
  writeChain = writeChain
    .then(() => rxChar.writeValueWithoutResponse
      ? rxChar.writeValueWithoutResponse(bytes)
      : rxChar.writeValue(bytes))
    .catch(e => log("! błąd zapisu: " + e.message));
}

async function connect() {
  if (!navigator.bluetooth) {
    $("hint").innerHTML = '<span class="err">Ta przeglądarka nie obsługuje Web Bluetooth.</span> ' +
      'Otwórz stronę w Chrome na Androidzie, pod adresem https://.';
    return;
  }
  try {
    if (!device) {
      device = await navigator.bluetooth.requestDevice({
        filters: [{ services: [NUS] }, { namePrefix: "RF Meter" }],
        optionalServices: [NUS]
      });
      device.addEventListener("gattserverdisconnected", onDisconnected);
    }
    userDisconnect = false;
    setStatus("łączenie…", "wait");
    const server = await device.gatt.connect();
    const svc = await server.getPrimaryService(NUS);
    txChar = await svc.getCharacteristic(TX);
    rxChar = await svc.getCharacteristic(RX);
    await txChar.startNotifications();
    txChar.addEventListener("characteristicvaluechanged", onNotify);
    connected = true;
    reconnectTries = 0;
    setStatus("połączony", "on");
    enableUi(true);
    setTimeout(() => send("GUI"), 400);          // miernik zaczyna wysyłać ramki ekranu
    requestWakeLock();
  } catch (e) {
    setStatus("rozłączony", "");
    if (e.name !== "NotFoundError") log("! " + e.message);   // NotFound = anulowano wybór
  }
}

function disconnect() {
  userDisconnect = true;
  if (device && device.gatt.connected) {
    send("TXT");
    setTimeout(() => device.gatt.disconnect(), 200);
  }
}

function onDisconnected() {
  connected = false; rxChar = null; txChar = null; data = null;
  enableUi(false);
  releaseWakeLock();
  if (!userDisconnect && reconnectTries < 5) {
    reconnectTries++;
    setStatus("ponowne łączenie… (" + reconnectTries + ")", "wait");
    setTimeout(connect, 2000);
  } else {
    setStatus("rozłączony", "");
  }
}

function onNotify(ev) {
  lineBuf += dec.decode(ev.target.value, { stream: true });
  let i;
  while ((i = lineBuf.indexOf("\n")) >= 0) {
    const line = lineBuf.slice(0, i).replace(/\r$/, "");
    lineBuf = lineBuf.slice(i + 1);
    if (line.startsWith("$D;")) parseFrame(line);
    else if (line.length) log(line);
  }
  if (lineBuf.length > 1000) lineBuf = "";
}

// $D;ekran;pasmo;zakres;inDbm;mV;detDbm;max;min;aku;akuJest;hold;avg;
//    jednostka;tlumik;korekta;detMin;detMax;minmax;komunikat
function parseFrame(line) {
  const p = line.split(";");
  if (p.length < 19) return;
  const n = (k) => parseFloat(p[k]);
  data = {
    scr: n(1) | 0, band: n(2) | 0, rs: n(3) | 0, inDbm: n(4), mv: n(5), det: n(6),
    max: n(7), min: n(8), bat: n(9), batP: p[10] === "1", hold: p[11] === "1",
    avg: n(12) | 0, unit: n(13) | 0, att: n(14), off: n(15), dmin: n(16), dmax: n(17),
    mm: p[18] === "1", msg: p.slice(19).join(";")
  };
  lastFrameAt = Date.now();
  if (recording) recordFrame(data);
  const info = $("info");
  if (data.scr !== 0) { info.textContent = "Miernik jest w MENU – zmiany z telefonu wstrzymane"; info.className = "info menu"; }
  else { info.textContent = ""; info.className = "info"; }
}

// ---------------------------------------------------------------------
//  Wake Lock - ekran telefonu nie gaśnie w trakcie pomiaru
// ---------------------------------------------------------------------
async function requestWakeLock() {
  try { if ("wakeLock" in navigator) wakeLock = await navigator.wakeLock.request("screen"); } catch (e) {}
}
function releaseWakeLock() { try { wakeLock && wakeLock.release(); } catch (e) {} wakeLock = null; }
document.addEventListener("visibilitychange", () => {
  if (document.visibilityState === "visible" && connected) requestWakeLock();
});

// ---------------------------------------------------------------------
//  Zapis CSV
// ---------------------------------------------------------------------
let recording = false, recRows = [];
const UNIT_NAME = ["dBm", "W", "dBuV", "Vrms"];
function recordFrame(d) {
  recRows.push([new Date().toISOString(), d.band, d.rs, d.inDbm.toFixed(2), d.mv.toFixed(0),
                d.det.toFixed(2), d.att.toFixed(1), d.off.toFixed(1), d.bat.toFixed(2), d.hold ? 1 : 0].join(";"));
}
function toggleRec() {
  if (!recording) {
    recRows = []; recording = true;
    $("btnRec").textContent = "■ Zatrzymaj i pobierz CSV";
    return;
  }
  recording = false;
  $("btnRec").textContent = "● Zapis CSV";
  if (!recRows.length) return;
  const head = "czas;pasmo;zakres;in_dBm;det_mV;det_dBm;tlumik_dB;korekta_dB;aku_V;hold\n";
  const blob = new Blob([head + recRows.join("\n") + "\n"], { type: "text/csv" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "rf_meter_" + new Date().toISOString().slice(0, 19).replace(/[:T]/g, "-") + ".csv";
  a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 2000);
}

// ---------------------------------------------------------------------
//  Rysowanie - odwzorowanie ekranu TFT 128x128 (drawMain z programu)
// ---------------------------------------------------------------------
const S = 4;                                    // skala: 1 piksel TFT = 4 px
const cv = $("tft"), ctx = cv.getContext("2d");
const C = {
  BLACK: "#000000", WHITE: "#ffffff", GREY: "#7b7d7b", DGREY: "#393c39",
  RED: "#ff0000", GREEN: "#00ff00", BLUE: "#0000ff", NAVY: "#00007b",
  CYAN: "#00ffff", YELLOW: "#ffff00", ORANGE: "#ffa500", MAGENTA: "#ff00ff", LBLUE: "#2192ff"
};
const BAND_NAME = ["1-10 MHz", "10-100 MHz", "0.1-1 GHz", "1-2 GHz", "2-6 GHz"];
const trunc = Math.trunc;

function fillRect(x, y, w, h, c) { ctx.fillStyle = c; ctx.fillRect(x * S, y * S, w * S, h * S); }
function drawRect(x, y, w, h, c) {
  fillRect(x, y, w, 1, c); fillRect(x, y + h - 1, w, 1, c);
  fillRect(x, y, 1, h, c); fillRect(x + w - 1, y, 1, h, c);
}
function vline(x, y, h, c) { fillRect(x, y, 1, h, c); }
function hline(x, y, w, c) { fillRect(x, y, w, 1, c); }
function roundPath(x, y, w, h, r) {
  ctx.beginPath();
  if (ctx.roundRect) ctx.roundRect(x, y, w, h, r); else ctx.rect(x, y, w, h);
}
function drawRoundRect(x, y, w, h, r, c) {
  ctx.strokeStyle = c; ctx.lineWidth = S;
  roundPath(x * S + S / 2, y * S + S / 2, (w - 1) * S, (h - 1) * S, r * S); ctx.stroke();
}
function fillRoundRect(x, y, w, h, r, c) {
  ctx.fillStyle = c; roundPath(x * S, y * S, w * S, h * S, r * S); ctx.fill();
}
function line(x0, y0, x1, y1, c) {
  ctx.strokeStyle = c; ctx.lineWidth = S; ctx.beginPath();
  ctx.moveTo(x0 * S + S / 2, y0 * S + S / 2); ctx.lineTo(x1 * S + S / 2, y1 * S + S / 2); ctx.stroke();
}

// Tekst w siatce znaków 6 x 8 jak czcionka Adafruit GFX
function textWidth(s, size) { return s.length * 6 * size; }
function printAt(x, y, s, c, size = 1) {
  ctx.fillStyle = c;
  ctx.textBaseline = "top";
  ctx.textAlign = "center";
  ctx.font = "bold " + (8.4 * S * size) + 'px "DejaVu Sans Mono", "Roboto Mono", "Courier New", monospace';
  for (let i = 0; i < s.length; i++) {
    ctx.fillText(s[i], (x + i * 6 * size + 2.5 * size) * S, (y - 0.4 * size) * S);
  }
}
function printRight(xr, y, s, c, size = 1) { printAt(xr - textWidth(s, size), y, s, c, size); }
function printCenter(y, s, c, size = 1) { printAt(trunc((128 - textWidth(s, size) + size) / 2), y, s, c, size); }

// Formatowanie jak w programie miernika
function fmtSig(v) { const a = Math.abs(v); return a >= 100 ? v.toFixed(0) : a >= 10 ? v.toFixed(1) : v.toFixed(2); }
function fmtPower(dbm) {
  const w = Math.pow(10, (dbm - 30) / 10);
  const tab = [[1, "W"], [1e-3, "mW"], [1e-6, "uW"], [1e-9, "nW"], [1e-12, "pW"]];
  let i = 0; while (i < 4 && w < tab[i][0]) i++;
  return [fmtSig(w / tab[i][0]), tab[i][1]];
}
function fmtVrms(dbm) {
  const v = Math.sqrt(Math.pow(10, (dbm - 30) / 10) * 50);
  if (v >= 1) return [fmtSig(v), "V"];
  if (v >= 1e-3) return [fmtSig(v * 1e3), "mV"];
  return [fmtSig(v * 1e6), "uV"];
}
function fmtMain(dbm, unit) {
  switch (unit) {
    case 1: return fmtPower(dbm);
    case 2: return [(dbm + 107).toFixed(1), "dBuV"];
    case 3: return fmtVrms(dbm);
    default: return [dbm.toFixed(1), "dBm"];
  }
}
const sgn = (v) => (v >= 0 ? "+" : "") + v.toFixed(1);
const pad = (s, n) => s.padStart(n, " ");

function batPercent(v) {
  const V = [3.30, 3.50, 3.60, 3.70, 3.80, 3.90, 4.00, 4.10, 4.20];
  const P = [0, 5, 15, 35, 55, 70, 82, 92, 100];
  if (v <= V[0]) return 0;
  for (let i = 1; i < 9; i++) if (v <= V[i]) return P[i-1] + trunc((v - V[i-1]) / (V[i] - V[i-1]) * (P[i] - P[i-1]));
  return 100;
}
function batColor(v) { return v >= 3.70 ? C.GREEN : v >= 3.50 ? C.YELLOW : C.RED; }

function drawBattery(x, y, d) {
  drawRect(x, y, 12, 7, C.WHITE);
  fillRect(x + 12, y + 2, 2, 3, C.WHITE);
  if (!d.batP) { line(x + 2, y + 1, x + 9, y + 5, C.RED); return; }
  const w = trunc((batPercent(d.bat) * 10 + 50) / 100);
  if (w > 0) fillRect(x + 1, y + 1, w, 5, batColor(d.bat));
}

function drawBtIcon(x, y, c) {
  vline(x + 2, y, 9, c);
  line(x + 2, y, x + 4, y + 2, c);  line(x + 4, y + 2, x, y + 6, c);
  line(x + 2, y + 8, x + 4, y + 6, c); line(x + 4, y + 6, x, y + 2, c);
}

function drawIdle() {
  fillRect(0, 0, 128, 128, C.BLACK);
  drawRoundRect(1, 1, 126, 126, 6, C.GREEN);
  printCenter(40, "RF METER", C.YELLOW, 2);
  printCenter(62, "1.1 BT", C.CYAN, 1);
  if (connected) printCenter(86, "oczekiwanie", C.WHITE);
  else           printCenter(86, "brak polaczenia", C.GREY);
  printCenter(98, connected ? "na dane..." : "nacisnij Polacz", C.GREY);
}

function drawMain(d) {
  fillRect(0, 0, 128, 128, C.BLACK);

  // pasek gorny
  fillRect(0, 0, 128, 11, C.NAVY);
  drawBtIcon(1, 1, C.GREEN);
  const top = "Band-" + d.band + " " + (BAND_NAME[d.band - 1] || "");
  printAt(8 + trunc((104 - textWidth(top, 1) + 1) / 2), 2, top, C.YELLOW);
  drawBattery(113, 2, d);

  const over = d.rs > 0, under = d.rs < 0;
  const FX = 3, FY = 13, FW = 122, FH = 47;
  drawRoundRect(FX, FY, FW, FH, 3, C.GREEN);

  if (d.rs !== 0) {
    const ty = FY + trunc((FH - 27) / 2);
    printCenter(ty, "Sygnal RF", C.YELLOW, 1);
    printCenter(ty + 13, over ? "WYSOKI" : "NISKI", C.RED, 2);
  } else {
    const ty = FY + trunc((FH - 37) / 2);
    const [val, unit] = fmtMain(d.inDbm, d.unit);
    const vw = textWidth(val, 3) - 3, uw = textWidth(unit, 1) - 1;
    let vx = trunc((128 - vw - uw - 3) / 2);
    if (vx < FX + 2) vx = FX + 2;
    printAt(vx, ty, val, C.GREEN, 3);
    printAt(vx + vw + 3, ty + 14, unit, C.WHITE, 1);
    let aux;
    if (d.unit === 0) { const [v2, u2] = fmtPower(d.inDbm); aux = v2 + " " + u2; }
    else aux = d.inDbm.toFixed(1) + " dBm";
    printCenter(ty + 29, aux, C.CYAN);
  }

  // bargraf
  const bx = FX, by = 65, bw = FW, bh = 9;
  const lo = d.dmin + d.off + d.att, hi = d.dmax + d.off + d.att;
  drawRect(bx, by, bw, bh, C.WHITE);
  if (!under) {
    const f = Math.min(1, Math.max(0, (d.inDbm - lo) / (hi - lo)));
    const fw = trunc(f * (bw - 2));
    for (let i = 0; i < fw; i++) {
      const p = i / (bw - 2);
      vline(bx + 1 + i, by + 1, bh - 2, p < 0.6 ? C.GREEN : p < 0.85 ? C.YELLOW : C.RED);
    }
  }
  if (d.mm && d.max > -900) {
    const f = Math.min(1, Math.max(0, (d.max - lo) / (hi - lo)));
    vline(bx + 1 + trunc(f * (bw - 3)), by - 2, bh + 4, C.WHITE);
  }
  for (let i = 0; i <= 4; i++) vline(bx + trunc(i * (bw - 1) / 4), by + bh, 3, C.WHITE);
  printAt(bx, by + bh + 4, lo.toFixed(0), C.WHITE);
  printRight(bx + bw, by + bh + 4, hi.toFixed(0), C.WHITE);
  printCenter(by + bh + 4, "dBm", C.WHITE);

  // MAX / MIN
  if (d.mm) {
    printAt(FX, 89, d.max > -900 ? "MAX " + d.max.toFixed(1) : "MAX ---", C.ORANGE);
    printRight(FX + FW, 89, d.min < 900 ? "MIN " + d.min.toFixed(1) : "MIN ---", C.CYAN);
  }

  // dane detektora
  hline(FX, 100, FW, C.WHITE);
  printCenter(104, "Det " + pad(d.mv.toFixed(0), 4) + "mV " + pad(d.det.toFixed(1), 6) + "dBm", C.WHITE);

  // pasek dolny
  const showK = (d.att !== 0 || d.off !== 0);
  const batCenter = d.batP && !showK;
  if (over)                      printAt(3, 116, "WYSOKI", C.MAGENTA);
  else if (under)                printAt(3, 116, "NISKI", C.LBLUE);
  else if (d.batP && showK)      printAt(3, 116, d.bat.toFixed(2) + "V", batColor(d.bat));
  else                           printAt(3, 116, "OK", C.GREEN);
  if (showK)          printAt(52, 116, "K" + sgn(d.att + d.off), C.YELLOW);
  else if (batCenter) printCenter(116, d.bat.toFixed(2) + "V", batColor(d.bat));
  if (d.hold) { fillRoundRect(97, 114, 28, 11, 2, C.RED); printRight(124, 116, "HOLD", C.WHITE); }
  else        printRight(125, 116, "AVG" + d.avg, C.WHITE);

  // komunikat (jak drawMessage)
  if (d.msg) {
    const w = textWidth(d.msg, 1) + 16, x = trunc((128 - w) / 2);
    fillRoundRect(x, 50, w, 24, 4, C.NAVY);
    drawRoundRect(x, 50, w, 24, 4, C.YELLOW);
    printCenter(58, d.msg, C.YELLOW);
  }
}

function frame() {
  if (connected && data && Date.now() - lastFrameAt < 3000) drawMain(data);
  else drawIdle();
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

// ---------------------------------------------------------------------
//  Przyciski
// ---------------------------------------------------------------------
$("btnConnect").addEventListener("click", () => connected ? disconnect() : connect());
$("btnRec").addEventListener("click", toggleRec);
$("btnSend").addEventListener("click", () => {
  const v = $("cmd").value.trim();
  if (v) { send(v); log("> " + v); $("cmd").value = ""; }
});
$("cmd").addEventListener("keydown", (e) => { if (e.key === "Enter") $("btnSend").click(); });

document.querySelectorAll("[data-act]").forEach(b => b.addEventListener("click", () => {
  const d = data;
  switch (b.dataset.act) {
    case "bandUp": if (d) send("B" + (d.band % 5 + 1)); break;
    case "bandDn": if (d) send("B" + ((d.band + 3) % 5 + 1)); break;
    case "unit":   if (d) send("UNIT " + ((d.unit + 1) % 4)); break;
    case "hold":   send("HOLD"); break;
    case "mmrst":  send("MAXRST"); break;
    case "save":   send("SAVE"); break;
  }
}));

if (!navigator.bluetooth) {
  $("hint").innerHTML = '<span class="err">Ta przeglądarka nie obsługuje Web Bluetooth.</span> ' +
    'Otwórz stronę w <b>Chrome</b> na Androidzie, pod adresem <b>https://</b>.';
}
</script>
</body>
</html>
